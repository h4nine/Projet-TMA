<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>title</title>
    <style>
      body {
        font-family: sans-serif;
        background: #f4f4f4;
        padding: 20px;
      }
      .container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 30px;
      }
      .card {
        background: white;
        padding: 15px;
        border-radius: 12px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .card h2 {
        margin: 0;
        color: #333;
        text-transform: capitalize;
      }
      .card img {
        width: 100%;
        height: 150px;
        object-fit: cover;
        border-radius: 8px;
      }
      .debug-url {
        font-size: 10px;
        color: #888;
        word-break: break-all;
        background: #eee;
        padding: 5px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h1>playlists</h1>

    <div class="container">
      {% for item in emotions %}
      <div class="card">
        <h2>{{ item.emotion }}</h2>

        {% if item.image %}
        <img src="{{ item.image }}" alt="{{ item.emotion }}" />
        {% else %}
        <div
          style="
            height: 150px;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
          "
        >
          Image manquante
        </div>
        {% endif %}

        <p>{{ item.description }}</p>

        <div class="debug-url">Source : {{ item.spotify_url }}</div>

        <iframe
          src="{{ item.spotify_url }}"
          width="100%"
          height="152"
          frameborder="0"
          allowtransparency="true"
          allow="encrypted-media"
          loading="lazy"
        ></iframe>
      </div>
      {% endfor %}
    </div>
  </body>
</html>
