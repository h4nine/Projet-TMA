<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Moodify Gallery</title>
    <style>
      .container {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
        padding: 20px;
      }
      .card {
        border: 1px solid #ddd;
        border-radius: 8px;
        width: 200px;
        text-align: center;
        padding: 10px;
        box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
      }
      .card img {
        max-width: 100%;
        border-radius: 5px;
        height: 150px;
        object-fit: cover;
      }
      h3 {
        text-transform: capitalize;
        color: #333;
      }
    </style>
  </head>
  <body>
    <h1 style="text-align: center">Mes Émotions (depuis MongoDB)</h1>
    <div class="container">
      {% for item in emotions %}
      <div class="card">
        <h2>{{ item.emotion }}</h2>
        <img src="{{ item.image }}" alt="{{ item.emotion }}" />
        <p>{{ item.description }}</p>
      </div>
      {% endfor %}
    </div>
  </body>
</html>
